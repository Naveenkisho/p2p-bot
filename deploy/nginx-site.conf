# Reverse-proxy + HTTPS for the PUBLIC CUSTOMER WEBSITE (not the admin panel).
# The bot binds the site to 127.0.0.1:8090; nginx is the only thing public.
#
#   sudo cp deploy/nginx-site.conf /etc/nginx/sites-available/p2p-site
#   sudo nano /etc/nginx/sites-available/p2p-site     # set server_name + certs
#   sudo ln -s /etc/nginx/sites-available/p2p-site /etc/nginx/sites-enabled/
#   sudo rm -f /etc/nginx/sites-enabled/default       # or it wins on the bare IP
#   sudo nginx -t && sudo systemctl reload nginx
#
# Edit the COPY under /etc/nginx, never this file in the git tree — local edits
# here make the next `git pull` abort and you'd deploy nothing.
#
# ── The two proxy headers that change behaviour ──────────────────────────────
# X-Forwarded-For   → the site's per-IP limits (new orders/hour, deposit
#                     re-scans/minute, claim attempts). WITHOUT IT every visitor
#                     shares ONE bucket and real customers start seeing "too
#                     many orders from this connection". The app reads the LAST
#                     hop, so a single-value $remote_addr is correct and cannot
#                     be spoofed by a client-supplied header.
# X-Forwarded-Proto → whether the identity cookie gets its Secure flag and
#                     whether HSTS is sent. This must describe the leg between
#                     the VISITOR and Cloudflare, not the one between Cloudflare
#                     and this server — see cloudflare-realip.conf.
# Host is passed for sane logs/redirects; the app builds only relative links.
#
# The app already sends X-Content-Type-Options, X-Frame-Options, Referrer-Policy
# and HSTS itself — don't duplicate them here.

server {
    # default_server matters: without it the alphabetically-first enabled vhost
    # answers requests to the bare server IP — which would be the ADMIN PANEL.
    listen 443 ssl default_server;
    # Uncomment ONLY if this VPS has IPv6. On a v4-only box nginx refuses to
    # start at all ("Address family not supported"), taking the site down
    # rather than degrading. Cloudflare reaches an v4-only origin fine and
    # still serves your IPv6 visitors.
    # listen [::]:443 ssl default_server;
    server_name example.com;                 # <- ONE canonical hostname

    # Cloudflare Origin Certificate (SSL/TLS → Origin Server → Create). Free,
    # 15 years, no renewal cron, and valid for "Full (strict)". If you'd rather
    # use Let's Encrypt, see DEPLOY.md — certbot needs extra care behind proxy.
    ssl_certificate     /etc/ssl/cloudflare/origin.pem;
    ssl_certificate_key /etc/ssl/cloudflare/origin.key;

    # Request paths carry per-order capability tokens (/o/<token>), which is why
    # the app runs with its own access log off. Don't re-leak them here.
    access_log off;

    client_max_body_size 64k;                # the only POST is a short form

    gzip on;
    gzip_proxied any;                        # without this, gzip never runs:
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 512;

    location / {
        proxy_pass http://127.0.0.1:8090;
        proxy_http_version 1.1;              # keepalive; the order page polls
        proxy_set_header Connection "";
        proxy_set_header Host              $host;
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_set_header X-Forwarded-Proto $visitor_scheme;

        proxy_connect_timeout  5s;
        # a claim POST does an on-chain lookup inline before it answers
        proxy_read_timeout    60s;
        proxy_send_timeout    60s;
    }
}

server {
    listen 80 default_server;
    # listen [::]:80 default_server;         # uncomment only if the VPS has IPv6
    server_name example.com;

    # Behind Cloudflare this rarely runs (turn on SSL/TLS → Edge Certificates →
    # "Always Use HTTPS" so the redirect happens at the edge instead), but it
    # keeps the origin honest if someone reaches it directly.
    location /.well-known/acme-challenge/ { root /var/www/html; }
    location / { return 301 https://$host$request_uri; }
}
