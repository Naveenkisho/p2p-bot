# Cloudflare support for nginx — install at HTTP level, NOT inside a server{}:
#
#   sudo cp deploy/cloudflare-realip.conf /etc/nginx/conf.d/cloudflare.conf
#   sudo nginx -t && sudo systemctl reload nginx
#
# Two problems this solves, both invisible until they cost you money.
#
# 1. REAL VISITOR IP. With the orange cloud on, every request reaches nginx from
#    a Cloudflare edge, so $remote_addr is a Cloudflare address and ALL of your
#    customers land in the same per-IP bucket. The site would then refuse real
#    buyers with "too many orders from this connection" as soon as ad traffic
#    arrives, and a single abuser would lock out everyone behind their colo.
#    real_ip rewrites $remote_addr back to the true visitor — and because it is
#    honoured ONLY from Cloudflare's own ranges, a forged header from anyone
#    else is ignored.
#
# 2. THE VISITOR'S SCHEME. Cloudflare talks to this server over HTTPS even when
#    the visitor arrived on http://, so $scheme says "https" for a request the
#    browser made in the clear. The app would then mark the identity cookie
#    Secure on a plain-http response — which browsers silently discard, leaving
#    the customer stuck on "please enable cookies" forever. CF-Visitor carries
#    the scheme the VISITOR actually used, so trust that when it is present.
#
# ── Keeping the range list fresh ─────────────────────────────────────────────
# Cloudflare adds ranges occasionally, and a missing range fails silently (that
# visitor is throttled as a Cloudflare IP). Regenerate this file from the source
# of truth, and re-run it after any Cloudflare announcement:
#
#   { curl -fsS https://www.cloudflare.com/ips-v4/; \
#     curl -fsS https://www.cloudflare.com/ips-v6/; } \
#     | sed 's|^|set_real_ip_from |; s|$|;|' \
#     | sudo tee /etc/nginx/conf.d/cloudflare-ranges.conf
#   sudo nginx -t && sudo systemctl reload nginx
#
# If you do that, delete the set_real_ip_from lines below and keep the rest.

set_real_ip_from 173.245.48.0/20;
set_real_ip_from 103.21.244.0/22;
set_real_ip_from 103.22.200.0/22;
set_real_ip_from 103.31.4.0/22;
set_real_ip_from 141.101.64.0/18;
set_real_ip_from 108.162.192.0/18;
set_real_ip_from 190.93.240.0/20;
set_real_ip_from 188.114.96.0/20;
set_real_ip_from 197.234.240.0/22;
set_real_ip_from 198.41.128.0/17;
set_real_ip_from 162.158.0.0/15;
set_real_ip_from 104.16.0.0/13;
set_real_ip_from 104.24.0.0/14;
set_real_ip_from 172.64.0.0/13;
set_real_ip_from 131.0.72.0/22;
set_real_ip_from 2400:cb00::/32;
set_real_ip_from 2606:4700::/32;
set_real_ip_from 2803:f800::/32;
set_real_ip_from 2405:b500::/32;
set_real_ip_from 2405:8100::/32;
set_real_ip_from 2a06:98c0::/29;
set_real_ip_from 2c0f:f248::/32;

real_ip_header CF-Connecting-IP;

# The scheme the visitor used, falling back to this hop's scheme when the
# request didn't come through Cloudflare. Referenced by nginx-site.conf.
map $http_cf_visitor $visitor_scheme {
    default                 $scheme;
    '~"scheme":"https"'     https;
    '~"scheme":"http"'      http;
}
